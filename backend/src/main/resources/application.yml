server:
  port: ${PORT:8080}
  error:
    include-message: never
spring:
  config:
    import: optional:file:./.env[.properties],optional:file:../.env[.properties]
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/harbor}
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:postgres}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  mail:
    host: ${SMTP_HOST:localhost}
    port: ${SMTP_PORT:1025}
    username: ${SMTP_USER:}
    password: ${SMTP_PASSWORD:}
    properties:
      mail.smtp.auth: ${SMTP_AUTH:false}
      mail.smtp.starttls.enable: ${SMTP_TLS:false}
      mail.smtp.connectiontimeout: 5000
      mail.smtp.timeout: 5000
app:
  time-zone: ${HOSPITAL_TIMEZONE:UTC}
  public-url: ${PUBLIC_URL:http://localhost:5173}
  seed: ${SEED_DEMO:false}
  admin-email: ${ADMIN_EMAIL:admin@hospital.local}
  admin-password: ${ADMIN_PASSWORD:}
  mail-enabled: ${MAIL_ENABLED:false}
  mail-from: ${MAIL_FROM:appointments@hospital.local}
